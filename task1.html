
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Information</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #74ebd5, #9face6);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background-color: white;
            width: 400px;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
        }

        hr {
            border: 1px solid #ddd;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
        }

        button:hover {
            background-color: #4c5fd5;
        }

        #result {
            margin-top: 25px;
            text-align: left;
        }

        #result h2 {
            color: #333;
            text-align: center;
            margin-bottom: 15px;
        }

        #result p {
            background-color: #f1f3ff;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            color: #333;
            font-size: 15px;
        }

        @media (max-width: 450px) {
            .container {
                width: 90%;
            }
        }

    </style>

</head>
<body>

    <div class="container">

        <h1>🌤️ Weather Information</h1>

        <hr>

        <input type="text" id="city" placeholder="Enter city name">

        <br><br>

        <button onclick="getData()">Get Data</button>

        <div id="result"></div>

    </div>

    <script>

        function getData() {

            let place = document.getElementById("city").value.trim();

            if (place === "") {
                document.getElementById("result").innerHTML =
                "<p>Please enter a city name</p>";
                return;
            }

            fetch("https://geocoding-api.open-meteo.com/v1/search?name=" + encodeURIComponent(place) + "&count=1")

            .then(response => response.json())

            .then(location => {

                if (!location.results) {
                    document.getElementById("result").innerHTML = "City not found";
                    return;
                }

                let lat = location.results[0].latitude;
                let lon = location.results[0].longitude;

                fetch("https://api.open-meteo.com/v1/forecast?latitude=" + lat + "&longitude=" + lon + "&current=temperature_2m,relative_humidity_2m,wind_speed_10m")

                .then(response => response.json())

                .then(data => {

                    console.log(data);

                    document.getElementById("result").innerHTML =

                    "<h2>Weather Details</h2>" +

                    "<p>📍 City: " + place + "</p>" +

                    "<p>🌡️ Temperature: " + data.current.temperature_2m + " °C</p>" +

                    "<p>💧 Humidity: " + data.current.relative_humidity_2m + " %</p>" +

                    "<p>💨 Wind Speed: " + data.current.wind_speed_10m + " km/h</p>";

                });

            })

            .catch(error => {
                console.log(error);
                document.getElementById("result").innerHTML =
                "<p>Something went wrong. Please try again.</p>";
            });

        }

    </script>

</body>
</html>
